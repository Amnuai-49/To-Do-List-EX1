<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My To-Do{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f4f6fb; }
    .brand { font-weight:700; letter-spacing:1px; }
    .task-card { border:0; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .task-done .task-title { text-decoration:line-through; color:#9aa0ab; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand brand" href="{% url 'task_list' %}">✅ My To-Do</a>
    <div class="d-flex gap-2 align-items-center">
      {% if user.is_authenticated %}
        <a class="btn btn-sm btn-light" href="{% url 'profile' %}">🔔 Telegram</a>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Logout ({{ user.username }})</button></form>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container pb-5" style="max-width:820px">{% block content %}{% endblock %}</div>
</body>
</html>
