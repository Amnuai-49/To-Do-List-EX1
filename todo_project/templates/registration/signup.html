{% extends "base.html" %}
{% block content %}
<div class="card task-card p-4 mx-auto" style="max-width:400px">
  <h4 class="mb-3">สมัครสมาชิก</h4>
  <form method="post">{% csrf_token %}
    {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}<div class="text-danger small">{{ f.errors }}</div></div>{% endfor %}
    <button class="btn btn-primary w-100">Sign up</button>
  </form>
</div>
<script>document.querySelectorAll("input").forEach(i=>{if(i.type!="hidden")i.classList.add("form-control")})</script>
{% endblock %}
