{% extends "base.html" %}
{% block content %}
<div class="card task-card p-4 mx-auto" style="max-width:400px">
  <h4 class="mb-3">Login</h4>
  <form method="post">{% csrf_token %}
    {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}</div>{% endfor %}
    {% if form.errors %}<div class="text-danger small mb-2">Username หรือ password ไม่ถูกต้อง</div>{% endif %}
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <div class="mt-3 small">ยังไม่มีบัญชี? <a href="{% url 'signup' %}">สมัครสมาชิก</a></div>
</div>
<script>document.querySelectorAll("input").forEach(i=>{if(i.type!="hidden")i.classList.add("form-control")})</script>
{% endblock %}
